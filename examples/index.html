<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <title>Lunar Date Picker - Examples</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
        'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #f6f7f9;
      color: #171717;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      width: 100%;
    }
    .header {
      text-align: center;
      margin-bottom: 36px;
    }
    .header h1 {
      font-size: 42px;
      margin-bottom: 10px;
      font-weight: 700;
    }
    .header .icon {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      background: #fff1f1;
      color: #b93131;
      font-size: 20px;
      font-weight: 700;
      overflow: hidden;
    }
    .header .icon img {
      width: 100%;
      height: 100%;
      display: block;
    }
    .header p {
      font-size: 18px;
      color: #6b7280;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
    }
    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 32px;
      text-align: center;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: #d7dbe3;
      box-shadow: 0 18px 36px rgba(15, 23, 42, 0.12);
    }
    .card-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 18px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-weight: 700;
    }
    .card h2 {
      font-size: 28px;
      margin-bottom: 12px;
      color: #171717;
    }
    .card p {
      font-size: 16px;
      color: #6b7280;
      line-height: 1.6;
    }
    .card.vue {
      border-top: 4px solid #42b883;
    }
    .card.react {
      border-top: 4px solid #61dafb;
    }
    .card.vue .card-icon {
      background: #ecfdf5;
      color: #047857;
    }
    .card.react .card-icon {
      background: #eff6ff;
      color: #0369a1;
    }
    .footer {
      text-align: center;
      margin-top: 36px;
      color: #6b7280;
    }
    .footer a {
      color: #6b7280;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      transition: color 0.2s, border-color 0.2s;
    }
    .footer a:hover {
      color: #b93131;
      border-color: #f0caca;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="icon">
        <img src="./assets/lunar-picker-logo.svg" alt="Lunar Picker">
      </div>
      <h1>Lunar Date Picker</h1>
      <p>移动端公历/农历日期选择器，支持 Vue 3 与 React 18/19</p>
    </div>

    <div class="cards">
      <a href="./vue/" class="card vue">
        <div class="card-icon">Vue</div>
        <h2>Vue 3 Demo</h2>
        <p>查看 Vue 3 版本的示例<br>验证新日历模式与返回数据</p>
      </a>

      <a href="./react/" class="card react">
        <div class="card-icon">React</div>
        <h2>React Demo</h2>
        <p>查看 React 18/19 版本的示例<br>使用 Hooks 和函数组件</p>
      </a>
    </div>

    <div class="footer">
      <a href="https://github.com/Gavinoio/lunar-picker" target="_blank">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        View on GitHub
      </a>
    </div>
  </div>
</body>
</html>
