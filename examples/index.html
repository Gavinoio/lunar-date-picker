<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunar Date Picker - Examples</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
        Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      width: 100%;
    }
    .header {
      text-align: center;
      color: white;
      margin-bottom: 60px;
    }
    .header h1 {
      font-size: 48px;
      margin-bottom: 16px;
      font-weight: 700;
    }
    .header .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    .header p {
      font-size: 20px;
      opacity: 0.9;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }
    .card-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    .card h2 {
      font-size: 28px;
      margin-bottom: 12px;
      color: #333;
    }
    .card p {
      font-size: 16px;
      color: #666;
      line-height: 1.6;
    }
    .card.vue {
      border-top: 4px solid #42b883;
    }
    .card.react {
      border-top: 4px solid #61dafb;
    }
    .footer {
      text-align: center;
      margin-top: 60px;
      color: white;
      opacity: 0.8;
    }
    .footer a {
      color: white;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      transition: background 0.3s;
    }
    .footer a:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="icon">🌙</div>
      <h1>Lunar Date Picker</h1>
      <p>移动端公历/农历日期选择器</p>
    </div>

    <div class="cards">
      <a href="./vue/" class="card vue">
        <div class="card-icon">🟢</div>
        <h2>Vue 3 Demo</h2>
        <p>查看 Vue 3 版本的示例<br>支持组合式 API 和选项式 API</p>
      </a>

      <a href="./react/" class="card react">
        <div class="card-icon">⚛️</div>
        <h2>React Demo</h2>
        <p>查看 React 18 版本的示例<br>使用 Hooks 和函数组件</p>
      </a>
    </div>

    <div class="footer">
      <a href="https://github.com/Gavinoio/lunar-date-picker" target="_blank">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        View on GitHub
      </a>
    </div>
  </div>
</body>
</html>
