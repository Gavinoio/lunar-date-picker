name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm install

      - name: Install Vue demo dependencies
        run: cd examples/vue-demo && npm install

      - name: Install React demo dependencies
        run: cd examples/react-demo && npm install

      - name: Build Vue demo
        run: cd examples/vue-demo && npm run build

      - name: Build React demo
        run: cd examples/react-demo && npm run build

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          cp examples/index.html deploy/
          mkdir -p deploy/vue
          cp -r examples/vue-demo/dist/* deploy/vue/
          mkdir -p deploy/react
          cp -r examples/react-demo/dist/* deploy/react/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
