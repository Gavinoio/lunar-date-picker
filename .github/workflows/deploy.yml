name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build library
        run: npm run build

      - name: Verify package exports
        run: npm run test:package

      - name: Check package contents
        run: npm pack --dry-run

      - name: Build Vue demo
        run: npm run build -w vue-demo

      - name: Build React demo
        run: npm run build -w react-demo

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          cp examples/index.html deploy/
          mkdir -p deploy/assets
          cp assets/*.svg deploy/assets/
          mkdir -p deploy/vue
          cp -r examples/vue-demo/dist/* deploy/vue/
          mkdir -p deploy/react
          cp -r examples/react-demo/dist/* deploy/react/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
